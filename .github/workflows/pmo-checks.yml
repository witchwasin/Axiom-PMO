name: Axiom-PMO Checks

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a maintainer (or an AI executor under Human direction) run this
  # workflow against a feature branch with an explicit risk-based profile --
  # without widening the automatic push trigger above and without defaulting
  # to every host on ordinary work. See docs/architecture/ci-risk-based.md.
  workflow_dispatch:
    inputs:
      profile:
        description: 'CI profile: fast, targeted, or full'
        required: true
        type: choice
        default: 'fast'
        options: [fast, targeted, full]
      suite:
        description: 'Suite for the targeted profile (doctor, hygiene, golden, validation-fixtures, config-mutation, line-ending, plugin-drift, cli, github-action, all)'
        required: false
        type: string
      host:
        description: 'Host for the targeted profile (windows-ps51, windows-ps7, linux, macos, all)'
        required: false
        type: choice
        default: 'linux'
        options: [windows-ps51, windows-ps7, linux, macos, all]

permissions:
  contents: read

jobs:
  # Risk-based CI entry point (see docs/architecture/ci-risk-based.md). One job
  # resolves the profile -- fast, targeted, or full -- from the event:
  #
  #   * workflow_dispatch -> the caller's explicit `profile` input
  #   * push to main       -> always `full` (the merge/release gate)
  #   * pull_request       -> classified from the changed paths by
  #                           dist/tools/ci-profile-cli.js (single source of truth)
  #
  # Every downstream job is gated on this output, so ordinary work never fires
  # every host by accident, and a validator/config change can never be narrowed
  # to a docs-only fast run by a path filter. If the diff cannot be resolved the
  # resolver fails safe to `full` rather than silently fast.
  determine-profile:
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      suite: ${{ steps.resolve.outputs.suite }}
      hosts: ${{ steps.resolve.outputs.hosts }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Resolve CI profile
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          DISPATCH_SUITE: ${{ inputs.suite }}
          DISPATCH_HOST: ${{ inputs.host }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          classifier="dist/tools/ci-profile-cli.js"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node "$classifier" -Profile "$DISPATCH_PROFILE" -TargetHost "$DISPATCH_HOST" -Suite "$DISPATCH_SUITE" -GithubOutput
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # A push to main is the merge/release gate: always the full matrix.
            node "$classifier" -Profile full -GithubOutput
            exit 0
          fi

          # pull_request: classify from the changed paths.
          changed_path="$RUNNER_TEMP/changed-files.txt"
          : > "$changed_path"
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$changed_path" 2>"$RUNNER_TEMP/diff-err.txt"; then
              # Could not resolve the diff: fail safe to full, never silent-fast.
              echo "::warning::git diff failed ($(cat "$RUNNER_TEMP/diff-err.txt")); resolving to full profile"
              node "$classifier" -Profile full -GithubOutput
              exit 0
            fi
          fi
          node "$classifier" -ChangedPathsPath "$changed_path" -GithubOutput

  # fast: docs/report-only changes and ordinary work. Runs the five cheap,
  # high-value local-equivalent checks on one Linux pwsh host. This is the
  # default for a normal pull request so the four-host matrix does not run on
  # work that cannot affect a runtime.
  fast-checks:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Framework doctor
        shell: bash
        run: |
          node -e '
            import { runPmoDoctor, formatDoctorText } from "./dist/doctor/pmo-doctor.js";
            const r = runPmoDoctor(process.cwd());
            console.log(formatDoctorText(process.cwd(), r));
            process.exit(r.fail > 0 ? 1 : 0);
          '

      - name: Public hygiene
        shell: bash
        run: |
          node -e '
            import { checkPublicHygiene } from "./dist/tools/check-public-hygiene.js";
            const r = checkPublicHygiene(process.cwd());
            console.log(r.output);
            process.exit(r.exitCode);
          '

      # example-goldens (tests/golden/capture-examples.ps1) is dropped
      # entirely per master-plan.md's Phase 9 exit criteria; its case
      # coverage is carried forward by differential-probe.ts and
      # validation-fixtures.ts (both exercised by "Unit tests" below).

      - name: Plugin mirror drift
        shell: bash
        run: |
          node -e '
            import { buildPluginPackage } from "./dist/tools/build-plugin-package.js";
            const r = buildPluginPackage(process.cwd(), true);
            console.log(r.output);
            process.exit(r.exitCode);
          '

      - name: CLI tests
        shell: bash
        run: |
          node tests/helpers/cli-tests.mjs

  # targeted: code in a known area. Runs the full local-equivalent suite
  # (axiom check + hygiene + fault injection) on only the host(s) the
  # classifier selects. A dispatch may instead name a single `suite` to
  # narrow further via run-ci-suite-cli.js. Phase 9: every leg now runs the
  # same Node engine regardless of matrix.name/matrix.exe (kept in the
  # matrix JSON for host selection and informational value, but no longer
  # consumed to pick an interpreter -- there is only one now).
  targeted-checks:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'targeted'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-profile.outputs.matrix) }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks (${{ matrix.name }})
        shell: bash
        run: |
          if [ -n "$SUITE" ]; then
            node dist/tools/run-ci-suite-cli.js -Suite "$SUITE" -RepoPath .
          else
            node cli/axiom.mjs check
          fi
        env:
          SUITE: ${{ inputs.suite }}

      - name: Run public hygiene checks
        shell: bash
        run: |
          node -e '
            import { checkPublicHygiene } from "./dist/tools/check-public-hygiene.js";
            const r = checkPublicHygiene(process.cwd());
            console.log(r.output);
            process.exit(r.exitCode);
          '

      - name: Verify fault injection propagates as a failure
        shell: bash
        run: |
          set +e
          node cli/axiom.mjs check -TestChildScript tests/helpers/exit-1.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAULT INJECTION DID NOT PROPAGATE: check exited 0 with a failing -TestChildScript"
            exit 1
          fi
          echo "Fault injection correctly propagated as exit $code"
          exit 0

  # Windows, full profile. Job id kept as pmo-checks-windows-pwsh7 even though
  # it no longer runs PowerShell at all (Phase 9): branch protection's
  # required-status-checks list references job ids by name, and renaming this
  # would silently unsatisfy that setting until a human updates it separately
  # -- not something to risk as a side effect of a code change. Before Phase 9
  # this leg proved the validator behaved identically on PowerShell 7 and
  # Windows PowerShell 5.1; there is no longer a PowerShell reference to
  # compare against, so it now proves the same thing pmo-checks-linux-pwsh7
  # and pmo-checks-macos-pwsh7 prove on their own OS: the Node engine itself
  # works end to end on this platform.
  pmo-checks-windows-pwsh7:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks
        shell: bash
        run: |
          node cli/axiom.mjs check

      - name: Run public hygiene checks
        shell: bash
        run: |
          node -e '
            import { checkPublicHygiene } from "./dist/tools/check-public-hygiene.js";
            const r = checkPublicHygiene(process.cwd());
            console.log(r.output);
            process.exit(r.exitCode);
          '

      - name: Verify fault injection propagates as a failure
        shell: bash
        run: |
          set +e
          node cli/axiom.mjs check -TestChildScript tests/helpers/exit-1.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAULT INJECTION DID NOT PROPAGATE: check exited 0 with a failing -TestChildScript"
            exit 1
          fi
          echo "Fault injection correctly propagated as exit $code"
          exit 0

  # Linux, full profile. Job id kept as pmo-checks-linux-pwsh7 for the same
  # branch-protection reason as the Windows leg above.
  pmo-checks-linux-pwsh7:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks
        shell: bash
        run: |
          node cli/axiom.mjs check

      - name: Run public hygiene checks
        shell: bash
        run: |
          node -e '
            import { checkPublicHygiene } from "./dist/tools/check-public-hygiene.js";
            const r = checkPublicHygiene(process.cwd());
            console.log(r.output);
            process.exit(r.exitCode);
          '

      - name: Verify fault injection propagates as a failure
        shell: bash
        run: |
          set +e
          node cli/axiom.mjs check -TestChildScript tests/helpers/exit-1.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAULT INJECTION DID NOT PROPAGATE: check exited 0 with a failing -TestChildScript"
            exit 1
          fi
          echo "Fault injection correctly propagated as exit $code"
          exit 0

  # macOS, full profile smoke test. Non-blocking: macOS is a developer
  # convenience surface, not a reference platform. Job id kept as
  # pmo-checks-macos-pwsh7 for the same branch-protection reason as the other
  # two full-profile jobs above (it stopped running PowerShell in Phase 9).
  pmo-checks-macos-pwsh7:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks
        shell: bash
        run: |
          node cli/axiom.mjs check

  # Milestone 4 dogfooding: exercise action.yml itself, via `uses: ./`, the
  # same way an external consumer would -- not just the Node scripts behind
  # it (tests/helpers/github-action-tests.mjs already covers those directly).
  # This is the evidence that the composite action definition -- inputs,
  # outputs, the upload-artifact step -- actually works end to end.
  dogfood-github-action:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real, known-broken fixture. Default enforce is false (report-only),
      # so this step must succeed even though the project fails validation --
      # that is what report-only means. Its outputs are checked next.
      - name: Governance check, report-only, on a project with real findings
        id: report_only
        uses: ./
        with:
          project: demo/broken-project
          mode: Standard
          gate: Handoff
          artifact-name: axiom-pmo-report-dogfood-report-only

      - name: Verify report-only recorded the real result without failing the step
        shell: bash
        run: |
          echo "outcome=${{ steps.report_only.outputs.outcome }} exit-code=${{ steps.report_only.outputs.exit-code }}"
          if [ "${{ steps.report_only.outputs.outcome }}" != "failure" ]; then
            echo "::error::Expected outputs.outcome=failure for demo/broken-project (it has real FAIL rows); got '${{ steps.report_only.outputs.outcome }}'. Report-only mode may not be reading the validator result at all."
            exit 1
          fi

      # Same broken fixture, enforcement on. continue-on-error catches the
      # expected failure so the job can assert on it, exactly like the
      # existing "Verify fault injection propagates as a failure" steps
      # above assert on axiom check -TestChildScript.
      - name: Governance check, enforced, on the same broken project
        id: enforced_fail
        continue-on-error: true
        uses: ./
        with:
          project: demo/broken-project
          mode: Standard
          gate: Handoff
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-enforced-fail

      - name: Verify enforcement actually blocks
        shell: bash
        run: |
          if [ "${{ steps.enforced_fail.outcome }}" != "failure" ]; then
            echo "::error::Expected the enforced step against demo/broken-project to fail; its outcome was '${{ steps.enforced_fail.outcome }}'. Enforcement is not blocking."
            exit 1
          fi
          echo "Enforcement correctly failed the step for a real governance violation."

      # A clean project with enforcement on must actually pass -- proves
      # enforcement does not false-positive on a project with no findings.
      - name: Governance check, enforced, on a clean project
        uses: ./
        with:
          project: examples/STANDARD-FEATURE
          mode: Standard
          gate: Release
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-enforced-clean

  # M4.5 dogfooding: exercises action.yml's SCOPE-DIFF inputs via `uses: ./`
  # against real, committed git objects (see demo/scope-diff-dogfood-{pass,fail}/),
  # not a mock.
  #
  # The two deltas are built by the job itself rather than referenced as
  # fixed SHAs from this repository's history. The original design pinned
  # three SHAs authored on a milestone branch; once those branches stopped
  # existing on `origin`, the commits became unreachable there and every run
  # failed with SCOPE-DIFF-004 "base commit could not be resolved" -- even
  # under fetch-depth: 0, which fetches all refs but cannot fetch a commit no
  # ref points at. Building the deltas in-job removes that dependency on
  # repository history entirely, and keeps the property the fixtures exist
  # for: the diff SCOPE-DIFF evaluates is a real `git diff` over real commits.
  #
  # A shallow checkout (the default everywhere else in this file) is now
  # enough, because both refs are created locally.
  dogfood-scope-diff:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Commits are local only -- nothing is pushed, and the checkout has no
      # credentials to push with. The two assertions are not decoration: if a
      # future edit to these fixtures widened or emptied a delta, the pass
      # case could silently become a no-op diff (which also verdicts pass) or
      # the fail case could flag a file other than the one it claims to test.
      - name: Build the dogfood delta commits
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "axiom-pmo-dogfood"
          git config user.email "axiom-pmo-dogfood@users.noreply.github.com"

          base="$(git rev-parse HEAD)"

          printf '// pass-case delta, committed by the dogfood-scope-diff job\n' \
            >> demo/scope-diff-dogfood-pass/src/app.ts
          git add demo/scope-diff-dogfood-pass/src/app.ts
          git commit --quiet -m "chore(dogfood): SCOPE-DIFF pass-case delta"
          pass_head="$(git rev-parse HEAD)"

          printf '\nFail-case delta, committed by the dogfood-scope-diff job.\n' \
            >> demo/scope-diff-dogfood-fail/README.md
          git add demo/scope-diff-dogfood-fail/README.md
          git commit --quiet -m "chore(dogfood): SCOPE-DIFF fail-case delta"
          fail_head="$(git rev-parse HEAD)"

          pass_changed="$(git diff --name-only "$base" "$pass_head")"
          if [ "$pass_changed" != "demo/scope-diff-dogfood-pass/src/app.ts" ]; then
            echo "::error::The pass-case delta must touch exactly demo/scope-diff-dogfood-pass/src/app.ts; it touched: ${pass_changed}"
            exit 1
          fi

          fail_changed="$(git diff --name-only "$pass_head" "$fail_head")"
          if [ "$fail_changed" != "demo/scope-diff-dogfood-fail/README.md" ]; then
            echo "::error::The fail-case delta must touch exactly demo/scope-diff-dogfood-fail/README.md; it touched: ${fail_changed}"
            exit 1
          fi

          {
            echo "base=$base"
            echo "pass-head=$pass_head"
            echo "fail-head=$fail_head"
          } >> "$GITHUB_OUTPUT"

          echo "base=$base pass-head=$pass_head fail-head=$fail_head"

      # demo/scope-diff-dogfood-pass/SCOPE.json approves its own whole
      # directory; the diff between these two commits touches only a file
      # inside it. Report-only (the default) and enforce must both pass --
      # this is the "no false positive" proof, not just "report-only hides
      # a failure."
      - name: SCOPE-DIFF, report-only, on a real in-scope change
        id: pass_report_only
        uses: ./
        with:
          project: demo/scope-diff-dogfood-pass
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: ${{ steps.fixtures.outputs.base }}
          scope-diff-head: ${{ steps.fixtures.outputs.pass-head }}
          artifact-name: axiom-pmo-report-dogfood-scope-diff-pass-report-only

      - name: Verify the in-scope case actually verdicts pass
        shell: bash
        run: |
          echo "scope-diff-verdict=${{ steps.pass_report_only.outputs.scope-diff-verdict }}"
          if [ "${{ steps.pass_report_only.outputs.scope-diff-verdict }}" != "pass" ]; then
            echo "::error::Expected scope-diff-verdict=pass for the in-scope dogfood fixture; got '${{ steps.pass_report_only.outputs.scope-diff-verdict }}'."
            exit 1
          fi

      - name: SCOPE-DIFF, enforced, on the same in-scope change
        uses: ./
        with:
          project: demo/scope-diff-dogfood-pass
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: ${{ steps.fixtures.outputs.base }}
          scope-diff-head: ${{ steps.fixtures.outputs.pass-head }}
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-scope-diff-pass-enforced

      # demo/scope-diff-dogfood-fail/SCOPE.json approves only src/**; the
      # diff between these two commits is exactly one real, committed file
      # (README.md) outside it. Report-only must still report the true
      # verdict without failing the step.
      - name: SCOPE-DIFF, report-only, on a real out-of-scope change
        id: fail_report_only
        uses: ./
        with:
          project: demo/scope-diff-dogfood-fail
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: ${{ steps.fixtures.outputs.pass-head }}
          scope-diff-head: ${{ steps.fixtures.outputs.fail-head }}
          artifact-name: axiom-pmo-report-dogfood-scope-diff-fail-report-only

      - name: Verify report-only recorded the violation without failing the step
        shell: bash
        run: |
          echo "scope-diff-verdict=${{ steps.fail_report_only.outputs.scope-diff-verdict }}"
          if [ "${{ steps.fail_report_only.outputs.scope-diff-verdict }}" != "fail" ]; then
            echo "::error::Expected scope-diff-verdict=fail for the out-of-scope dogfood fixture; got '${{ steps.fail_report_only.outputs.scope-diff-verdict }}'. SCOPE-DIFF may not be evaluating real changed files at all."
            exit 1
          fi

      # Same violation, enforcement on. continue-on-error so the job can
      # assert on the expected failure, exactly like the M4 dogfood job
      # above does for its own enforced case.
      - name: SCOPE-DIFF, enforced, on the same out-of-scope change
        id: fail_enforced
        continue-on-error: true
        uses: ./
        with:
          project: demo/scope-diff-dogfood-fail
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: ${{ steps.fixtures.outputs.pass-head }}
          scope-diff-head: ${{ steps.fixtures.outputs.fail-head }}
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-scope-diff-fail-enforced

      - name: Verify enforcement actually blocks a real SCOPE-DIFF violation
        shell: bash
        run: |
          if [ "${{ steps.fail_enforced.outcome }}" != "failure" ]; then
            echo "::error::Expected the enforced step against demo/scope-diff-dogfood-fail to fail; its outcome was '${{ steps.fail_enforced.outcome }}'. SCOPE-DIFF enforcement is not blocking."
            exit 1
          fi
          echo "Enforcement correctly failed the step for a real SCOPE-DIFF violation."

  # The one adapter with a real external trust boundary is also the one that
  # cannot be tested offline: verifying a ci-check means querying the GitHub
  # API for a check run on an exact commit. The offline suite therefore only
  # covers the negative path (no remote -> unverified), which review correctly
  # called a MAJOR test gap -- the positive path, where a real check run is
  # found and its observed conclusion decides the verdict, had never executed.
  #
  # This job closes that. It runs where a real API, a real repository, and real
  # check runs exist, and asserts all four directions: a genuine passing check
  # verifies; a check name that does not exist does not; a commit SHA with no
  # such check does not; and -- the one that matters most -- a result claiming
  # `conclusion: success` for a check the API reports otherwise is still
  # rejected, because the claimed conclusion is never read.
  dogfood-ci-check-evidence:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Read access to check runs on this repository's own commits.
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Verify the ci-check adapter against the real GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test dist/exec/ci-check-evidence-live.test.js

  # Phase 7 canary bookkeeping (Fixed_plan/phase7/PLAN.md §3). Every full-profile
  # run recomputes the SHA-256 manifest over the validation surface (src/**/*.ts,
  # scripts/**/*.ps1, pmo-config/*.json, Fixed_plan/phase0/compatibility-case-
  # manifest.md, tests/golden/**) and diffs it against the committed
  # Fixed_plan/phase7/canary-baseline.json via scripts/canary-baseline.mjs:
  #
  #   * clean + qualifying (push to main, the §4 definition) -> appends
  #     "run clean N=..." to canary-log.md; the run counts toward N.
  #   * clean + non-qualifying -> verified but not counted (no log line).
  #   * any difference -> appends "N RESET: <files>" to canary-log.md, re-captures
  #     the baseline at the new SHA, and fails the step so the drift is visible
  #     (a real reset is not something to absorb silently). CI has no push
  #     credentials, so the re-captured baseline + log are shipped as the
  #     phase7-canary artifact for the maintainer to commit; the gate stays red
  #     until that happens, which is the point -- a human owns the re-baseline.
  canary-baseline:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # --record computes the verdict, appends the run/reset line, re-captures
      # the baseline on reset, and exits 1 on reset (making drift a red run).
      - name: Canary baseline diff / reset / log
        shell: bash
        env:
          CANARY_EVENT: ${{ github.event_name }}
        run: node scripts/canary-baseline.mjs --record

      # Ship the possibly-updated files even when the step above failed on a
      # reset, so the maintainer can commit the re-captured baseline + log.
      - name: Upload canary log and baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase7-canary
          path: |
            Fixed_plan/phase7/canary-log.md
            Fixed_plan/phase7/canary-baseline.json
          if-no-files-found: error

  # Phase 7 canary matrix (Fixed_plan/phase7/PLAN.md §4): the same 4-host set the
  # full profile already runs, each on both the pinned Node (24.18.0) and the
  # package.json engines floor (>=22.0.0 -> the oldest supported LTS of the 22.x
  # line, 22.11.0). Each cell drives the CLI (cli/axiom.mjs) against a clean
  # example project. `rollbackHost` (Windows cells only) no longer feeds a CLI
  # toggle -- Phase 8 (DEC-030/031) removed AXIOM_ROLLBACK_PWSH entirely -- it
  # now only pins which real reference host (powershell.exe 5.1 / pwsh 7) the
  # NTFS-junction containment probe spawns directly, below. Gated to push-to-main
  # full runs, the §4 qualifying trigger; PRs use the existing fast/targeted/full
  # jobs.
  canary-matrix:
    needs: determine-profile
    if: needs.determine-profile.outputs.profile == 'full' && github.event_name == 'push'
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-ps51
            runsOn: windows-2025
            node: '24.18.0'
            rollbackHost: powershell.exe
          - name: windows-ps51-node22
            runsOn: windows-2025
            node: '22.11.0'
            rollbackHost: powershell.exe
          - name: windows-ps7
            runsOn: windows-2025
            node: '24.18.0'
            rollbackHost: pwsh
          - name: windows-ps7-node22
            runsOn: windows-2025
            node: '22.11.0'
            rollbackHost: pwsh
          - name: linux
            runsOn: ubuntu-24.04
            node: '24.18.0'
            rollbackHost: ''
          - name: linux-node22
            runsOn: ubuntu-24.04
            node: '22.11.0'
            rollbackHost: ''
          - name: macos
            runsOn: macos-15
            node: '24.18.0'
            rollbackHost: ''
          - name: macos-node22
            runsOn: macos-15
            node: '22.11.0'
            rollbackHost: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The canary's actual measure: the real CLI binary must validate a clean
      # project with zero FAIL rows and exit 0. (Pre-Phase-8 this step also ran
      # a second time per Windows cell with AXIOM_ROLLBACK_PWSH=1 to exercise
      # the rollback path against a real reference host; that toggle no longer
      # exists post-cutover (DEC-030/031), so there is nothing left to give
      # that second run a distinct meaning from this one -- removed rather than
      # kept as a pointless duplicate.)
      - name: Canary CLI exercise (${{ matrix.name }})
        shell: bash
        run: |
          node -e '
            const { spawnSync } = require("node:child_process");
            const r = spawnSync(process.execPath,
              ["cli/axiom.mjs", "validate", "--project", "examples/STANDARD-FEATURE", "--json"],
              { encoding: "utf8" });
            if (r.status !== 0) {
              console.error("cli validate exited " + r.status + "\n--- stdout ---\n" + r.stdout + "\n--- stderr ---\n" + r.stderr);
              process.exit(1);
            }
            const env = JSON.parse(r.stdout);
            if (env.summary.fail !== 0 || env.summary.exit_code !== 0) {
              console.error("unexpected summary: " + r.stdout);
              process.exit(1);
            }
            console.log("OK: " + env.summary.pass + " pass, 0 fail, exit 0");
          '

      # CR-017 containment (Fixed_plan/phase8/CR-017-review-material.md §5): the
      # NTFS-junction case can only be exercised on a real Windows host. Windows
      # cells create a real junction and prove SETUP-003 refuses it the same way
      # it refuses a symlink -- on the in-process engine and the PS reference --
      # and that the pointed-at file stays untouched. Non-Windows cells skip
      # inside the probe itself.
      - name: Canary containment exercise (${{ matrix.name }}), NTFS junction
        if: runner.os == 'Windows'
        shell: bash
        env:
          AXIOM_PWSH: ${{ matrix.rollbackHost }}
        run: node dist/probe/junction-probe.js
