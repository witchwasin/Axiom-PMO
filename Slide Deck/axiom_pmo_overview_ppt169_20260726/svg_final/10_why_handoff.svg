    <text font-family="Tahoma, Arial, sans-serif" fill="#3A3F45" font-weight="400" font-size="18" x="72" y="378">ฟีเจอร์สแกนต้องใช้กล้อง แต่ไม่มีใครตัดสินว่าหน้าเว็บจะเสิร์ฟยังไง</text><text font-family="Tahoma, Arial, sans-serif" fill="#3A3F45" font-weight="400" font-size="18" x="72" y="400">ทำงานบน localhost แต่พังบนแท็บเล็ตที่ยืมมา</text><text x="1208" y="378" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">code review จับไม่ได้</text>
