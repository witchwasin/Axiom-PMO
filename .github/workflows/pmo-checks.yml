name: Axiom-PMO Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pmo-checks:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The thin CLI (cli/axiom.mjs) is the only part of the framework that is
      # not PowerShell. Pinning Node here means run-all-checks.ps1 runs its CLI
      # tests instead of reporting them as skipped.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # run-all-checks verifies the golden masters as part of the fixture run;
      # a separate verification step would re-execute all 148 cases for nothing.
      - name: Run PMO framework checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath .

      - name: Run public hygiene checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\check-public-hygiene.ps1 -RepoPath .

      - name: Verify fault injection propagates as a failure
        shell: powershell
        run: |
          # -TestChildScript deliberately fails first, so run-all-checks.ps1
          # must exit non-zero here -- if it exits 0, the aggregator is
          # silently swallowing a child failure. Invert the assertion.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath . -TestChildScript tests\helpers\exit-1.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "FAULT INJECTION DID NOT PROPAGATE: run-all-checks.ps1 exited 0 with a failing -TestChildScript"
            exit 1
          }
          Write-Host "Fault injection correctly propagated as exit $LASTEXITCODE"
          exit 0

  # Linux/macOS execution via PowerShell 7 is EXPERIMENTAL. This leg exists to
  # produce evidence for that claim rather than assertions about it, and is
  # deliberately non-blocking: Windows PowerShell 5.1 above stays the supported
  # reference platform. Promote it to a required leg only once it has a track
  # record, not because it happens to be green today.
  pmo-checks-linux-experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # Golden masters are stored in a form independent of the PowerShell host's
      # JSON pretty-printer (see scripts/lib/golden-normalizer.ps1). This leg is
      # what proves it: run-all-checks verifies the same golden files here under
      # pwsh 7 that the Windows PowerShell 5.1 job verifies above.
      - name: Run PMO framework checks under pwsh
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-all-checks.ps1 -RepoPath .
