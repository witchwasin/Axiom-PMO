name: "Axiom-PMO Governance Check"
description: "Verify a project's requirements, scope, evidence, and release authority with Axiom-PMO's Node.js governance engine."
author: "Axiom-PMO"
branding:
  icon: "shield"
  color: "blue"

inputs:
  project:
    description: "Project path to validate, relative to the consumer repository workspace (or absolute)."
    required: true
  mode:
    description: "PMO mode: Lite, Standard, or Strict."
    required: false
    default: "Standard"
  gate:
    description: "Validation gate: Draft, Scope, Design, Handoff, or Release."
    required: false
    default: "Release"
  fail-on-warning:
    description: "Whether a blocking WARN counts toward the governance verdict (validator exit code 2 instead of 0)."
    required: false
    default: "true"
  working-directory:
    description: "Directory the Action resolves --project and report paths from. Defaults to the job's workspace."
    required: false
    default: "."
  upload-artifact:
    description: "Whether to upload axiom-report.json and axiom-report.md as a workflow artifact."
    required: false
    default: "true"
  artifact-name:
    description: >-
      Name for the uploaded artifact. actions/upload-artifact v4 rejects a
      second artifact with the same name in one workflow run, so a workflow
      that calls this Action more than once (for example, once per project
      in a matrix, or once for a report-only pass and once enforced) must
      give each call a distinct name.
    required: false
    default: "axiom-pmo-report"
  annotation-mode:
    description: "'safe' emits sanitized FAIL/WARN annotations on the pull request; 'off' emits none."
    required: false
    default: "safe"
  enforce:
    description: >-
      Whether a governance verdict (FAIL, or a blocking WARN under
      fail-on-warning) fails this workflow step. Defaults to false
      (report-only): findings are still reported in full -- Job Summary,
      annotations, and the JSON/Markdown report -- but the step exits 0 so a
      first-time install cannot break a pull request nobody has configured
      yet. Set to true once your team has reviewed a few report-only runs
      and wants the check to actually block. This default does not soften an
      infrastructure failure (a crash in the engine itself, not a governance
      verdict): that always fails the step regardless of this setting.
    required: false
    default: "false"
  enable-scope-diff:
    description: >-
      Compare changed files (base..head) against the project's approved
      implementation_scope (SCOPE.json). Off by default -- M4's own
      behavior is unchanged unless a workflow opts in. On a pull_request
      event, base/head are read automatically from the GitHub event
      context unless scope-diff-base/scope-diff-head override them; on
      any other event (e.g. push), you must supply both explicitly.
    required: false
    default: "false"
  scope-diff-base:
    description: >-
      Base commit SHA for scope-diff. Overrides the pull_request event's
      base/head pair only when BOTH scope-diff-base and scope-diff-head are
      set -- setting only one is treated as setting neither and falls back
      to the pull_request event (or an actionable SCOPE-DIFF-004 on any
      other event), never a half-overridden pair.
    required: false
    default: ""
  scope-diff-head:
    description: "Head commit SHA for scope-diff. See scope-diff-base -- the two are only ever honoured as an explicit pair."
    required: false
    default: ""

outputs:
  exit-code:
    description: "The underlying validator's exit code (0 pass, 1 fail, 2 blocking warning, 127 infrastructure failure)."
    value: ${{ steps.run.outputs.exit-code }}
  outcome:
    description: "success, failure, warning, or runtime-missing."
    value: ${{ steps.run.outputs.outcome }}
  json-report:
    description: "Path to axiom-report.json."
    value: ${{ steps.run.outputs.json-report }}
  markdown-report:
    description: "Path to axiom-report.md."
    value: ${{ steps.run.outputs.markdown-report }}
  scope-diff-verdict:
    description: "pass, fail, scope_missing, invalid_scope, or git_error -- empty when enable-scope-diff was not set."
    value: ${{ steps.run.outputs.scope-diff-verdict }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.18.0"
        package-manager-cache: false

    - name: Run Axiom-PMO governance check
      id: run
      shell: bash
      run: |
        node "${{ github.action_path }}/scripts/github-action/run-action.mjs" \
          --project "${{ inputs.project }}" \
          --mode "${{ inputs.mode }}" \
          --gate "${{ inputs.gate }}" \
          --fail-on-warning "${{ inputs.fail-on-warning }}" \
          --working-directory "${{ inputs.working-directory }}" \
          --annotation-mode "${{ inputs.annotation-mode }}" \
          --enforce "${{ inputs.enforce }}" \
          --enable-scope-diff "${{ inputs.enable-scope-diff }}" \
          --scope-diff-base "${{ inputs.scope-diff-base }}" \
          --scope-diff-head "${{ inputs.scope-diff-head }}"
      env:
        # run-action.mjs reads this itself to auto-detect base/head on a
        # pull_request event; GITHUB_EVENT_PATH is already set by the Actions
        # runtime, this just makes the dependency explicit at the call site.
        AXIOM_GITHUB_EVENT_NAME: ${{ github.event_name }}

    # continue-on-error: the governance verdict already came from the `run`
    # step above and set this composite action's exit status. An unrelated
    # artifact-storage problem (quota, a transient API error, or -- before
    # `artifact-name` existed -- a name collision from calling this Action
    # more than once in one workflow run) must not overwrite that verdict
    # with an unrelated "failed" outcome.
    - name: Upload governance report
      id: upload
      if: ${{ inputs.upload-artifact == 'true' && !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.json-report }}
          ${{ steps.run.outputs.markdown-report }}
        if-no-files-found: warn
        retention-days: 30

    - name: Note a failed artifact upload
      if: ${{ inputs.upload-artifact == 'true' && steps.upload.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning title=Axiom-PMO report artifact not uploaded::The governance check itself completed (see outputs.outcome); only the report-artifact upload failed. If this workflow calls the Action more than once, give each call a distinct 'artifact-name'."
