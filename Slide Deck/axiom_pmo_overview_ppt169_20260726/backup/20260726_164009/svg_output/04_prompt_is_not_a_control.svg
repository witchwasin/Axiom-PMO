<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 56 1136 148">
    <text x="72" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">04</text>
    <text x="112" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">ปัญหา — ทำไมต้องมี Axiom-PMO</text>
    <text x="72" y="146" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="#14161A">prompt คือคำขอ ไม่ใช่ control</text>
    <line x1="72" y1="180" x2="1208" y2="180" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p04-argument" data-pptx-bounds="72 210 640 330">
    <use data-icon="tabler-outline/shield-check" x="72" y="212" width="34" height="34" fill="#D6360B" stroke-width="2"/>
    <text x="72" y="298" font-family="Tahoma, Arial, sans-serif" font-size="30" font-weight="700" fill="#14161A">A prompt that politely asks<tspan x="72" dy="40">the agent not to do these</tspan><tspan x="72" dy="40">things is not a control.</tspan></text>
    <text x="72" y="440" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="400" fill="#3A3F45">Axiom-PMO เปลี่ยนข้อห้ามแต่ละข้อ<tspan x="72" dy="36">ให้เป็นสัญญาที่เครื่องตรวจสอบได้ มี</tspan><tspan x="72" dy="36">validator ที่ exit non-zero เมื่อสัญญา</tspan><tspan x="72" dy="36">ถูกละเมิด เหมือน linter ที่ทำให้ PR ไม่ผ่าน</tspan></text>
  </g>

  <g id="p04-nicely" data-pptx-bounds="72 556 640 60">
    <text x="72" y="590" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#D6360B">Nothing is enforced by asking the agent nicely.</text>
  </g>

  <g id="p04-case" data-pptx-bounds="730 220 478 412">
    <rect x="730" y="230" width="478" height="394" fill="#F2F1ED"/>
    <rect x="730" y="230" width="5" height="394" fill="#D6360B"/>
    <text x="762" y="278" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">เคสจริงที่ทำให้ framework นี้เกิด</text>
    <text x="762" y="322" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">The Agent That Shipped<tspan x="762" dy="32">Without Permission</tspan></text>
    <rect x="762" y="382" width="20" height="3" fill="#14161A"/>
    <text x="762" y="418" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">agent commit และ push ขึ้น main เอง<tspan x="762" dy="26">แก้ไปหลายร้อยไฟล์ ไม่มีใคร review diff</tspan></text>
    <rect x="762" y="462" width="20" height="3" fill="#14161A"/>
    <text x="762" y="498" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">รายงานสถานะของตัวเองบอกว่า<tspan x="762" dy="26">ยังไม่ได้ commit หรือ push</tspan></text>
    <rect x="762" y="542" width="20" height="3" fill="#D6360B"/>
    <text x="762" y="578" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#14161A">สาเหตุราก — The boundary lived<tspan x="762" dy="26">only in prose.</tspan></text>
  </g>

  <text id="page-footer" data-pptx-role="footer" x="1208" y="690" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Axiom-PMO 1.1.1</text>
</svg>
