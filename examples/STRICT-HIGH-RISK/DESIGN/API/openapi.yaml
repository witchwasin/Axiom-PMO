openapi: 3.0.3
info:
  title: STRICT-HIGH-RISK Export Approval API
  version: 1.0.0
  description: Export approval and audit log endpoints
paths:
  /api/v1/exports/{id}/approve:
    post:
      summary: Approve export request
      operationId: approveExport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Export approved
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Request not found
        '409':
          description: Already approved or rejected
  /api/v1/exports/{id}/audit:
    get:
      summary: List audit log entries
      operationId: listAuditLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit logs list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Request not found
