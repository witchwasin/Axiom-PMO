name: Axiom-PMO Checks

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a maintainer run this workflow against a feature branch (for example
  # to gather real CI evidence for a milestone under review) without
  # widening the automatic push trigger above.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows PowerShell 5.1 (the OS-bundled powershell.exe) is the long-standing
  # reference platform. It stays a required, blocking regression so behaviour
  # cannot drift away from the environment most Windows developers still have.
  pmo-checks:
    runs-on: windows-2025
    # This job runs run-all-checks.ps1 twice (normal pass + fault-injection
    # pass) plus a hygiene check, on the slowest host (Windows PowerShell
    # 5.1). 15 minutes was sized before M7-M9 grew the suite; two verified
    # CI runs on 2026-08-03 (commit 4750395) timed out mid-suite with every
    # executed assertion still PASS, not failing content. 30 minutes leaves
    # real margin instead of chasing the ceiling again as the suite grows.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The thin CLI (cli/axiom.mjs) is the only part of the framework that is
      # not PowerShell. Pinning Node here means run-all-checks.ps1 runs its CLI
      # tests instead of reporting them as skipped.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # run-all-checks verifies the golden masters as part of the fixture run;
      # a separate verification step would re-execute all 148 cases for nothing.
      - name: Run PMO framework checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath .

      - name: Run public hygiene checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\check-public-hygiene.ps1 -RepoPath .

      - name: Verify fault injection propagates as a failure
        shell: powershell
        run: |
          # -TestChildScript deliberately fails first, so run-all-checks.ps1
          # must exit non-zero here -- if it exits 0, the aggregator is
          # silently swallowing a child failure. Invert the assertion.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath . -TestChildScript tests\helpers\exit-1.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "FAULT INJECTION DID NOT PROPAGATE: run-all-checks.ps1 exited 0 with a failing -TestChildScript"
            exit 1
          }
          Write-Host "Fault injection correctly propagated as exit $LASTEXITCODE"
          exit 0

  # Windows PowerShell 7 (pwsh). Milestone 3.5 makes PowerShell 7 the primary
  # portable runtime, and Windows is a reference platform, so this leg is
  # required too. It proves the validator behaves identically on PowerShell 7
  # and Windows PowerShell 5.1: a failure here points at a real cross-host
  # difference (JSON depth, encoding, regex), not at this leg. Confirm it is
  # green on the first CI run before relying on it; branch protection must add
  # it as a required check separately (a human action).
  pmo-checks-windows-pwsh7:
    runs-on: windows-2025
    # Single run-all-checks.ps1 pass, but on 2026-08-03 (commit 4750395) it
    # still finished with only ~13s of margin inside the old 15-minute
    # budget. Same growth pressure as pmo-checks above; matching headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath .

      - name: Run public hygiene checks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\check-public-hygiene.ps1 -RepoPath .

      - name: Verify fault injection propagates as a failure
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\run-all-checks.ps1 -RepoPath . -TestChildScript tests\helpers\exit-1.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "FAULT INJECTION DID NOT PROPAGATE: run-all-checks.ps1 exited 0 with a failing -TestChildScript"
            exit 1
          }
          Write-Host "Fault injection correctly propagated as exit $LASTEXITCODE"
          exit 0

  # Ubuntu + PowerShell 7. PowerShell 7 is the documented minimum for Linux.
  # This leg is now a blocking workflow job. Milestone 3.5 acceptance still
  # requires two consecutive green main runs after this promotion, plus human
  # acceptance; branch protection is a separate repository setting.
  pmo-checks-linux-pwsh7:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      # Golden masters are stored in a form independent of the PowerShell host's
      # JSON pretty-printer (see scripts/lib/golden-normalizer.ps1). This leg is
      # what proves it: run-all-checks verifies the same golden files here under
      # pwsh 7 that the Windows jobs verify above.
      - name: Run PMO framework checks under pwsh
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-all-checks.ps1 -RepoPath .

      - name: Run public hygiene checks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-public-hygiene.ps1 -RepoPath .

      - name: Verify fault injection propagates as a failure
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-all-checks.ps1 -RepoPath . -TestChildScript tests/helpers/exit-1.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "FAULT INJECTION DID NOT PROPAGATE: run-all-checks.ps1 exited 0 with a failing -TestChildScript"
            exit 1
          }
          Write-Host "Fault injection correctly propagated as exit $LASTEXITCODE"
          exit 0

  # macOS + PowerShell 7 smoke test (Milestone 3.5). Non-blocking: macOS is a
  # developer convenience surface, not a reference platform. It exists to gather
  # cross-host evidence, not to gate releases. Promote only with a reliable
  # track record.
  pmo-checks-macos-pwsh7:
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run PMO framework checks under pwsh
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-all-checks.ps1 -RepoPath .

  # Milestone 4 dogfooding: exercise action.yml itself, via `uses: ./`, the
  # same way an external consumer would -- not just the Node scripts behind
  # it (tests/helpers/github-action-tests.mjs already covers those directly).
  # This is the evidence that the composite action definition -- inputs,
  # outputs, the upload-artifact step -- actually works end to end.
  dogfood-github-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Real, known-broken fixture. Default enforce is false (report-only),
      # so this step must succeed even though the project fails validation --
      # that is what report-only means. Its outputs are checked next.
      - name: Governance check, report-only, on a project with real findings
        id: report_only
        uses: ./
        with:
          project: demo/broken-project
          mode: Standard
          gate: Handoff
          artifact-name: axiom-pmo-report-dogfood-report-only

      - name: Verify report-only recorded the real result without failing the step
        shell: bash
        run: |
          echo "outcome=${{ steps.report_only.outputs.outcome }} exit-code=${{ steps.report_only.outputs.exit-code }}"
          if [ "${{ steps.report_only.outputs.outcome }}" != "failure" ]; then
            echo "::error::Expected outputs.outcome=failure for demo/broken-project (it has real FAIL rows); got '${{ steps.report_only.outputs.outcome }}'. Report-only mode may not be reading the validator result at all."
            exit 1
          fi

      # Same broken fixture, enforcement on. continue-on-error catches the
      # expected failure so the job can assert on it, exactly like the
      # existing "Verify fault injection propagates as a failure" steps
      # above assert on run-all-checks.ps1 -TestChildScript.
      - name: Governance check, enforced, on the same broken project
        id: enforced_fail
        continue-on-error: true
        uses: ./
        with:
          project: demo/broken-project
          mode: Standard
          gate: Handoff
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-enforced-fail

      - name: Verify enforcement actually blocks
        shell: bash
        run: |
          if [ "${{ steps.enforced_fail.outcome }}" != "failure" ]; then
            echo "::error::Expected the enforced step against demo/broken-project to fail; its outcome was '${{ steps.enforced_fail.outcome }}'. Enforcement is not blocking."
            exit 1
          fi
          echo "Enforcement correctly failed the step for a real governance violation."

      # A clean project with enforcement on must actually pass -- proves
      # enforcement does not false-positive on a project with no findings.
      - name: Governance check, enforced, on a clean project
        uses: ./
        with:
          project: examples/STANDARD-FEATURE
          mode: Standard
          gate: Release
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-enforced-clean

  # M4.5 dogfooding: exercises action.yml's SCOPE-DIFF inputs via `uses: ./`
  # against real commits in this repository's own history (see
  # demo/scope-diff-dogfood-{pass,fail}/), not a mock. Needs full git
  # history -- fetch-depth: 0 -- because scope-diff-base references commits
  # a shallow checkout (the default everywhere else in this file) would not
  # have; this is also, deliberately, the same condition SCOPE-DIFF-004
  # exists to catch when a consumer's own checkout forgets it.
  dogfood-scope-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # demo/scope-diff-dogfood-pass/SCOPE.json approves its own whole
      # directory; the diff between these two commits touches only a file
      # inside it. Report-only (the default) and enforce must both pass --
      # this is the "no false positive" proof, not just "report-only hides
      # a failure."
      - name: SCOPE-DIFF, report-only, on a real in-scope change
        id: pass_report_only
        uses: ./
        with:
          project: demo/scope-diff-dogfood-pass
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: c9576a7ef0df9e406ad29783be2f1c2990c61c36
          scope-diff-head: 3974d20a9067e6e41c60f6a09d69cc7f680d5bb4
          artifact-name: axiom-pmo-report-dogfood-scope-diff-pass-report-only

      - name: Verify the in-scope case actually verdicts pass
        shell: bash
        run: |
          echo "scope-diff-verdict=${{ steps.pass_report_only.outputs.scope-diff-verdict }}"
          if [ "${{ steps.pass_report_only.outputs.scope-diff-verdict }}" != "pass" ]; then
            echo "::error::Expected scope-diff-verdict=pass for the in-scope dogfood fixture; got '${{ steps.pass_report_only.outputs.scope-diff-verdict }}'."
            exit 1
          fi

      - name: SCOPE-DIFF, enforced, on the same in-scope change
        uses: ./
        with:
          project: demo/scope-diff-dogfood-pass
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: c9576a7ef0df9e406ad29783be2f1c2990c61c36
          scope-diff-head: 3974d20a9067e6e41c60f6a09d69cc7f680d5bb4
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-scope-diff-pass-enforced

      # demo/scope-diff-dogfood-fail/SCOPE.json approves only src/**; the
      # diff between these two commits is exactly one real, committed file
      # (README.md) outside it. Report-only must still report the true
      # verdict without failing the step.
      - name: SCOPE-DIFF, report-only, on a real out-of-scope change
        id: fail_report_only
        uses: ./
        with:
          project: demo/scope-diff-dogfood-fail
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: 3974d20a9067e6e41c60f6a09d69cc7f680d5bb4
          scope-diff-head: 973530466146d0da2ce474ab112481305383cc60
          artifact-name: axiom-pmo-report-dogfood-scope-diff-fail-report-only

      - name: Verify report-only recorded the violation without failing the step
        shell: bash
        run: |
          echo "scope-diff-verdict=${{ steps.fail_report_only.outputs.scope-diff-verdict }}"
          if [ "${{ steps.fail_report_only.outputs.scope-diff-verdict }}" != "fail" ]; then
            echo "::error::Expected scope-diff-verdict=fail for the out-of-scope dogfood fixture; got '${{ steps.fail_report_only.outputs.scope-diff-verdict }}'. SCOPE-DIFF may not be evaluating real changed files at all."
            exit 1
          fi

      # Same violation, enforcement on. continue-on-error so the job can
      # assert on the expected failure, exactly like the M4 dogfood job
      # above does for its own enforced case.
      - name: SCOPE-DIFF, enforced, on the same out-of-scope change
        id: fail_enforced
        continue-on-error: true
        uses: ./
        with:
          project: demo/scope-diff-dogfood-fail
          mode: Standard
          gate: Draft
          enable-scope-diff: "true"
          scope-diff-base: 3974d20a9067e6e41c60f6a09d69cc7f680d5bb4
          scope-diff-head: 973530466146d0da2ce474ab112481305383cc60
          enforce: "true"
          artifact-name: axiom-pmo-report-dogfood-scope-diff-fail-enforced

      - name: Verify enforcement actually blocks a real SCOPE-DIFF violation
        shell: bash
        run: |
          if [ "${{ steps.fail_enforced.outcome }}" != "failure" ]; then
            echo "::error::Expected the enforced step against demo/scope-diff-dogfood-fail to fail; its outcome was '${{ steps.fail_enforced.outcome }}'. SCOPE-DIFF enforcement is not blocking."
            exit 1
          fi
          echo "Enforcement correctly failed the step for a real SCOPE-DIFF violation."

  # The one adapter with a real external trust boundary is also the one that
  # cannot be tested offline: verifying a ci-check means querying the GitHub
  # API for a check run on an exact commit. The offline suite therefore only
  # covers the negative path (no remote -> unverified), which review correctly
  # called a MAJOR test gap -- the positive path, where a real check run is
  # found and its observed conclusion decides the verdict, had never executed.
  #
  # This job closes that. It runs where a real API, a real repository, and real
  # check runs exist, and asserts all four directions: a genuine passing check
  # verifies; a check name that does not exist does not; a commit SHA with no
  # such check does not; and -- the one that matters most -- a result claiming
  # `conclusion: success` for a check the API reports otherwise is still
  # rejected, because the claimed conclusion is never read.
  dogfood-ci-check-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Read access to check runs on this repository's own commits.
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the ci-check adapter against the real GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/helpers/ci-check-evidence-live-tests.ps1 -RepoPath .
