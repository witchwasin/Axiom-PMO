<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 56 1136 148">
    <text x="72" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">15</text>
    <text x="112" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">พิสูจน์ว่าใช้ได้จริง</text>
    <text x="72" y="146" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="#14161A">กฎที่บังคับไม่ได้ ไม่ใช่กฎ</text>
    <line x1="72" y1="180" x2="1208" y2="180" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <!-- Top section: Hero stats (6 columns) -->
  <g id="p15-stats" data-pptx-bounds="72 200 1136 100">
    <text x="72" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">82</text>
    <text x="72" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">validation rules</text>

    <text x="261" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">14</text>
    <text x="261" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">handoff rules</text>

    <text x="450" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">12</text>
    <text x="450" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">review lenses</text>

    <text x="639" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">148</text>
    <text x="639" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">fixture test cases</text>

    <text x="828" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">7</text>
    <text x="828" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">skills โหลดตามงาน</text>

    <text x="1017" y="240" font-family="Consolas, Courier New, monospace" font-size="42" font-weight="700" fill="#14161A">5,414</text>
    <text x="1017" y="270" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">บรรทัด PowerShell</text>
  </g>

  <!-- Middle section: 2 columns -->
  <g id="p15-content" data-pptx-bounds="72 320 1136 220">
    <!-- Left Column: Protection -->
    <text x="72" y="340" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">engine ป้องกันตัวเองยังไง</text>

    <rect x="72" y="360" width="12" height="12" fill="#D6360B"/>
    <text x="96" y="372" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">
      <tspan x="96" dy="0">config-mutation test พิสูจน์ว่า JSON policy มีผลจริง</tspan>
      <tspan x="96" dy="24">แก้ policy แล้วกฎต้องเปลี่ยนพฤติกรรม</tspan>
    </text>

    <rect x="72" y="408" width="12" height="12" fill="#D6360B"/>
    <text x="96" y="420" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">
      <tspan x="96" dy="0">เทสต์ยืนยันว่า scaffold ที่ generate ออกมาใหม่แต่ยังไม่กรอก ต้อง fail ที่ด่าน Handoff</tspan>
      <tspan x="96" dy="24">เพราะ generator ที่ปล่อยของผ่านได้เท่ากับกำลังผลิตหลักฐานปลอม</tspan>
    </text>

    <rect x="72" y="456" width="12" height="12" fill="#D6360B"/>
    <text x="96" y="468" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">DOCTOR-009 ทำให้ build ล้มถ้ากฎอ้างถึงหน้าเอกสารที่ไม่มีอยู่จริง</text>

    <rect x="72" y="492" width="12" height="12" fill="#D6360B"/>
    <text x="96" y="504" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">
      <tspan x="96" dy="0">CI มีขั้น fault injection ที่กลับด้าน assertion</tspan>
      <tspan x="96" dy="24">เพื่อพิสูจน์ว่าตัวรันเทสต์ไม่กลืนความล้มเหลวของลูก</tspan>
    </text>

    <!-- Right Column: Usage -->
    <text x="660" y="340" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">เริ่มใช้ยังไง</text>

    <text x="660" y="372" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="400" fill="#3A3F45">
      <tspan x="660" dy="0">validate-project.ps1 -ProjectPath &lt;project&gt;</tspan>
      <tspan x="680" dy="24">-Mode Standard -Gate Handoff</tspan>
      <tspan x="660" dy="24">assess-handoff.ps1 -ProjectPath &lt;project&gt;</tspan>
      <tspan x="680" dy="24">-Mode Standard</tspan>
      <tspan x="660" dy="24">pmo-doctor.ps1</tspan>
      <tspan x="660" dy="24">run-validation-tests.ps1</tspan>
    </text>

    <text x="660" y="504" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">exit code: 0 ผ่าน / 1 fail / 2 warning</text>
    <text x="660" y="528" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Windows PowerShell 5.1 คือขาอ้างอิงที่บล็อกใน CI</text>
  </g>

  <!-- Bottom section: Closing statement on dark background -->
  <rect id="p15-closing-bg" data-pptx-role="decoration" x="0" y="560" width="1280" height="160" fill="#14161A"/>
  <g id="p15-closing-text" data-pptx-bounds="72 580 1136 120">
    <text x="640" y="615" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">AI can build.</text>
    <text x="640" y="660" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="32" font-weight="400" fill="#FFFFFF">
      <tspan x="640" dy="0">Axiom-PMO verifies the source, scope, evidence, tests,</tspan>
      <tspan x="640" dy="36">and authority behind the work.</tspan>
    </text>
  </g>
</svg>
