    <text x="324" y="350" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">Scope</text>
    <text x="324" y="392" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">requirement ทุกข้อ<tspan x="324" dy="24">มีแหล่งอ้างอิงและ</tspan><tspan x="324" dy="24">อนุมัติแล้วหรือยัง</tspan></text>
