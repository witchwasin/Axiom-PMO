  <g id="p08-note" data-pptx-bounds="72 516 1136 100">
    <text x="72" y="552" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">Handoff เป็นด่านตรวจ ไม่ใช่ด่านอนุมัติ — ไม่เพิ่มการเซ็นใหม่ แต่ใช้ Design Ready เดิม</text>
    <text x="72" y="592" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">แต่ละ gate มีรายการเอกสารที่ต้องมีของตัวเอง แยกตามโหมด กำหนดไว้ใน pmo-config/artifact-policy.json</text>
  </g>

  <text id="page-footer" data-pptx-role="footer" x="1208" y="690" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Axiom-PMO 1.1.1</text>
