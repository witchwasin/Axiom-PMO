<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Axiom-PMO English brand board</title>
  <desc id="desc">A Swiss-minimal brand board presenting the Axiom Gate identity, positioning, typography, palette, and dark-background application.</desc>

  <rect x="0" y="0" width="1600" height="900" fill="#FAFAF8"/>
  <rect x="0" y="0" width="1600" height="12" fill="#D6360B"/>
  <rect x="1080" y="12" width="520" height="888" fill="#14161A"/>

  <text x="72" y="64" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" letter-spacing="2.2" fill="#D6360B">AXIOM-PMO / BRAND SYSTEM / 2026</text>
  <text x="72" y="123" font-family="Tahoma, Arial, sans-serif" font-size="48" font-weight="700" fill="#14161A">Axiom Gate</text>
  <text x="72" y="158" font-family="Tahoma, Arial, sans-serif" font-size="21" font-weight="400" fill="#3A3F45">An enforceable boundary between instruction and authority.</text>

  <g transform="translate(72 194) scale(0.42)">
    <path d="M76 432L190 80H254L140 432H76Z" fill="#14161A"/>
    <path d="M258 80H322L436 432H372L258 80Z" fill="#14161A"/>
    <rect x="142" y="286" width="228" height="48" fill="#D6360B"/>
    <rect x="76" y="432" width="360" height="16" fill="#14161A"/>
  </g>
  <rect x="300" y="233" width="48" height="6" fill="#D6360B"/>
  <text x="300" y="318" font-family="Tahoma, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="0.8" fill="#14161A">AXIOM-PMO</text>
  <line x1="300" y1="342" x2="986" y2="342" stroke="#DEDDD8" stroke-width="2"/>
  <text x="300" y="383" font-family="Tahoma, Arial, sans-serif" font-size="23" font-weight="400" fill="#3A3F45">The governance control plane for AI-assisted software delivery.</text>

  <line x1="72" y1="440" x2="1008" y2="440" stroke="#DEDDD8" stroke-width="2"/>
  <text x="72" y="479" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" letter-spacing="1.8" fill="#3A3F45">01 / THE IDEA</text>

  <text x="72" y="529" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#14161A">SOURCE</text>
  <text x="72" y="558" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Work begins with</text>
  <text x="72" y="581" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">a verified origin.</text>
  <line x1="72" y1="600" x2="332" y2="600" stroke="#14161A" stroke-width="6"/>

  <text x="390" y="529" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#D6360B">GATE</text>
  <text x="390" y="558" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Rules become machine-enforced</text>
  <text x="390" y="581" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">boundaries.</text>
  <line x1="390" y1="600" x2="650" y2="600" stroke="#D6360B" stroke-width="6"/>

  <text x="708" y="529" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#14161A">AUTHORITY</text>
  <text x="708" y="558" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Release remains</text>
  <text x="708" y="581" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">a human decision.</text>
  <line x1="708" y1="600" x2="1008" y2="600" stroke="#14161A" stroke-width="6"/>

  <text x="72" y="642" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="700" fill="#14161A">Govern AI-assisted delivery without slowing it down.</text>
  <text x="72" y="681" font-family="Tahoma, Arial, sans-serif" font-size="23" font-weight="400" fill="#3A3F45">Ground every decision in verified source, evidence, and human authority.</text>

  <text x="72" y="750" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" letter-spacing="1.8" fill="#3A3F45">02 / COLOUR LANGUAGE</text>
  <rect x="72" y="780" width="178" height="60" fill="#14161A"/>
  <rect x="250" y="780" width="178" height="60" fill="#D6360B"/>
  <rect x="428" y="780" width="178" height="60" fill="#2E6B5E"/>
  <rect x="606" y="780" width="178" height="60" fill="#DEDDD8"/>
  <rect x="784" y="780" width="224" height="60" fill="#FFFFFF" stroke="#DEDDD8" stroke-width="2"/>
  <text x="84" y="867" font-family="Consolas, Courier New, monospace" font-size="13" fill="#3A3F45">GRAPHITE / #14161A</text>
  <text x="262" y="867" font-family="Consolas, Courier New, monospace" font-size="13" fill="#3A3F45">CONTROL / #D6360B</text>
  <text x="440" y="867" font-family="Consolas, Courier New, monospace" font-size="13" fill="#3A3F45">VERIFIED / #2E6B5E</text>
  <text x="618" y="867" font-family="Consolas, Courier New, monospace" font-size="13" fill="#3A3F45">GRID / #DEDDD8</text>
  <text x="796" y="867" font-family="Consolas, Courier New, monospace" font-size="13" fill="#3A3F45">SURFACE / #FAFAF8</text>

  <text x="1136" y="66" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#D6360B">DARK APPLICATION</text>
  <g transform="translate(1170 122) scale(0.66)">
    <path d="M76 432L190 80H254L140 432H76Z" fill="#FFFFFF"/>
    <path d="M258 80H322L436 432H372L258 80Z" fill="#FFFFFF"/>
    <rect x="142" y="286" width="228" height="48" fill="#D6360B"/>
    <rect x="76" y="432" width="360" height="16" fill="#FFFFFF"/>
  </g>
  <text x="1136" y="486" font-family="Tahoma, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.6" fill="#FFFFFF">AXIOM-PMO</text>
  <rect x="1136" y="513" width="54" height="6" fill="#D6360B"/>
  <text x="1136" y="560" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">AI can build.</text>
  <text x="1136" y="594" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Axiom-PMO verifies</text>
  <text x="1136" y="626" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">the source, scope,</text>
  <text x="1136" y="658" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">evidence, tests,</text>
  <text x="1136" y="690" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">and authority behind</text>
  <text x="1136" y="722" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">the work.</text>
  <line x1="1136" y1="770" x2="1530" y2="770" stroke="#3A3F45" stroke-width="2"/>
  <text x="1136" y="808" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="400" letter-spacing="1.4" fill="#DEDDD8">MARK / 32 PX MINIMUM</text>
  <g transform="translate(1136 828) scale(0.09375)">
    <path d="M76 432L190 80H254L140 432H76Z" fill="#FFFFFF"/>
    <path d="M258 80H322L436 432H372L258 80Z" fill="#FFFFFF"/>
    <rect x="142" y="286" width="228" height="48" fill="#D6360B"/>
    <rect x="76" y="432" width="360" height="16" fill="#FFFFFF"/>
  </g>
  <g transform="translate(1206 812) scale(0.125)">
    <path d="M76 432L190 80H254L140 432H76Z" fill="#FFFFFF"/>
    <path d="M258 80H322L436 432H372L258 80Z" fill="#FFFFFF"/>
    <rect x="142" y="286" width="228" height="48" fill="#D6360B"/>
    <rect x="76" y="432" width="360" height="16" fill="#FFFFFF"/>
  </g>
  <text x="1292" y="861" font-family="Consolas, Courier New, monospace" font-size="13" fill="#DEDDD8">32 / 64 PX</text>
</svg>
