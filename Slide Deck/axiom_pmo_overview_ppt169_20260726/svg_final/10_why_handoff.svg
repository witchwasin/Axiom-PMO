  <g id="p10-row-1" data-pptx-bounds="72 284 1136 64">
    <text x="72" y="310" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">schema กลางที่ทุกงานต้องอ่าน ถูกจัดคิวไว้หลังงานที่เรียกใช้มัน</text>
