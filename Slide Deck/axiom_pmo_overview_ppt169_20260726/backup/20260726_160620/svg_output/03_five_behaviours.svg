<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="72 56 1136 148">
    <text x="72" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">03</text>
    <text x="112" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">ปัญหา — ทำไมต้องมี Axiom-PMO</text>
    <text x="72" y="146" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="#14161A">AI ที่ไม่ถูกคุม จะทำห้าอย่างนี้เสมอ</text>
    <line x1="72" y1="180" x2="1208" y2="180" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p03-row-1" data-pptx-bounds="72 228 1136 78">
    <text x="72" y="250" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">01</text>
    <text x="120" y="250" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">invent</text>
    <text x="120" y="280" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">กุ requirement, acceptance criteria, actor หรือการอนุมัติ ที่ไม่เคยมีใครให้ไว้</text>
    <line x1="72" y1="302" x2="1208" y2="302" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p03-row-2" data-pptx-bounds="72 306 1136 78">
    <text x="72" y="328" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">02</text>
    <text x="120" y="328" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">silently expand scope</text>
    <text x="120" y="358" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">เติมฟีเจอร์ที่ดูน่าจะดี ซึ่งไม่มีใครขอ แล้วไม่บอกว่าเติม</text>
    <line x1="72" y1="380" x2="1208" y2="380" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p03-row-3" data-pptx-bounds="72 384 1136 78">
    <text x="72" y="406" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">03</text>
    <text x="120" y="406" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">claim evidence</text>
    <text x="120" y="436" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">อ้างว่าเทสต์ผ่าน หรือ QA อนุมัติแล้ว ทั้งที่ตัวเองเป็นคนสร้างหลักฐานนั้น</text>
    <line x1="72" y1="458" x2="1208" y2="458" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p03-row-4" data-pptx-bounds="72 462 1136 78">
    <text x="72" y="484" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">04</text>
    <text x="120" y="484" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">lose traceability</text>
    <text x="120" y="514" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">ทำให้สาวไม่ได้ว่าสิ่งที่ build ออกมา มาจากคำขอข้อไหนของใคร</text>
    <line x1="72" y1="536" x2="1208" y2="536" stroke="#DEDDD8" stroke-width="1"/>
  </g>

  <g id="p03-row-5" data-pptx-bounds="72 540 1136 78">
    <text x="72" y="562" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#D6360B">05</text>
    <text x="120" y="562" font-family="Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#14161A">cross authority boundaries</text>
    <text x="120" y="592" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">commit, push หรือ release โดยไม่มีมนุษย์คนไหนพูดว่าใช่</text>
  </g>

  <g id="p03-note" data-pptx-bounds="72 626 1136 44">
    <text x="72" y="650" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700" fill="#14161A">ทั้งห้าข้อนี้ AI ไม่ได้ตั้งใจโกหก — มันแค่เติมช่องว่างให้เต็ม</text>
  </g>

  <text id="page-footer" data-pptx-role="footer" x="1208" y="690" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A3F45">Axiom-PMO 1.1.1</text>
</svg>
