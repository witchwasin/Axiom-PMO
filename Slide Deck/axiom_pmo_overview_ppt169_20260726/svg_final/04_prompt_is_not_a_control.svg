    <text x="112" y="82" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#3A3F45">ปัญหา — ทำไมต้องมี Axiom-PMO</text>
    <text x="72" y="146" font-family="Tahoma, Arial, sans-serif" font-size="42" font-weight="700" fill="#14161A">prompt คือคำขอ ไม่ใช่ control</text>
